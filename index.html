:root{--bg:#ffc23d;--coral:#ff5a4e;--honey:#ffd23d;--ink:#1c1a23;--lip:#f3d69b;--paper:#fffdf6;--sand:#f3d69b;--sky:#4fb8ff;}
:root {
	--u: min(calc(100vw / 720), calc(100vh / 1280));
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #ffc23d;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	z-index: 1;
	display: flex;
	justify-content: center;
	background-color: var(--bg, #ffc23d);
	font-family: 'RgLilita', 'RgHuninn', sans-serif;
	visibility: hidden;
	transition: opacity 0.35s ease;
	-webkit-user-select: none;
	user-select: none;
}

#status.gone {
	opacity: 0;
	pointer-events: none;
}

#rg-col {
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	height: 100%;
	width: min(calc(560 * var(--u)), calc(100vw - 80 * var(--u)));
	padding: calc(40 * var(--u)) 0 calc(36 * var(--u));
	gap: calc(26 * var(--u));
}

/* the boot screen's own layout eases these onto its pieces (rgBoot.layout) */
#rg-mark, #rg-logo, #rg-bar, #rg-words {
	transition: translate 0.3s ease;
}

.rg-flex {
	flex: 1 1 0;
}

#rg-mark {
	align-self: center;
	width: calc(256 * var(--u));
	height: calc(256 * var(--u));
	animation: rg-breathe 2.6s ease-in-out infinite;
	transform-origin: 50% 82%;
}

@keyframes rg-breathe {
	0%, 100% { transform: scale(1.0, 1.0); }
	50% { transform: scale(1.025, 0.975); }
}

#rg-logo {
	align-self: center;
	width: 100%;
	height: calc(176 * var(--u));
	overflow: visible;
}

#rg-logo text {
	font-family: 'RgLilita', 'RgHuninn', sans-serif;
	stroke: var(--ink, #1c1a23);
	stroke-linejoin: round;
	paint-order: stroke fill;
}

#rg-dock {
	display: flex;
	flex-direction: column;
	gap: calc(14 * var(--u));
}

#rg-tip {
	box-sizing: border-box;
	display: flex;
	align-items: center;
	gap: calc(14 * var(--u));
	min-height: calc(100 * var(--u));
	padding: calc(10 * var(--u)) calc(16 * var(--u));
	background: var(--paper);
	border: calc(4 * var(--u)) solid var(--ink);
	border-radius: calc(18 * var(--u));
	box-shadow: 0 calc(7 * var(--u)) 0 0 var(--lip), 0 calc(7 * var(--u)) 0 calc(4 * var(--u)) var(--ink);
	margin-bottom: calc(8 * var(--u));
	cursor: pointer;
	transition: opacity 0.14s ease, translate 0.3s ease;
}

#rg-tip.swap {
	opacity: 0;
}

#rg-tip img {
	flex: 0 0 auto;
	width: calc(72 * var(--u));
	height: calc(72 * var(--u));
}

#rg-tip-title {
	font-size: calc(25 * var(--u));
	line-height: 1.1;
}

#rg-tip-text {
	font-size: calc(21 * var(--u));
	line-height: 1.15;
	color: var(--ink);
}

#rg-bar {
	position: relative;
	box-sizing: border-box;
	align-self: center;
	width: calc(330 * var(--u));
	height: calc(22 * var(--u));
	background: var(--sand);
	border: calc(4 * var(--u)) solid var(--ink);
	border-radius: 999px;
}

#rg-fill {
	position: absolute;
	left: calc(1 * var(--u));
	top: calc(1 * var(--u));
	height: calc(12 * var(--u));
	width: 0;
	border-radius: 999px;
	background: var(--honey);
}

#rg-words {
	margin-top: calc(-4 * var(--u));
	text-align: center;
	font-size: calc(25 * var(--u));
	color: var(--paper);
	--o: calc(3.5 * var(--u));
	text-shadow: var(--o) 0 0 var(--ink), calc(-1 * var(--o)) 0 0 var(--ink), 0 var(--o) 0 var(--ink),
		0 calc(-1 * var(--o)) 0 var(--ink), var(--o) var(--o) 0 var(--ink), calc(-1 * var(--o)) var(--o) 0 var(--ink),
		var(--o) calc(-1 * var(--o)) 0 var(--ink), calc(-1 * var(--o)) calc(-1 * var(--o)) 0 var(--ink);
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	bottom: 10%;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":13956372,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// The page: the toy box, the logotype, a tip and the bar, in the language
// the game spoke last (or the browser's).
(function () {
	const page = (typeof RG_PAGE !== 'undefined') ? RG_PAGE : null;
	const lang = (function () {
		try {
			const kept = localStorage.getItem('rg.lang');
			if (kept) {
				return kept.indexOf('zh') === 0 ? 'zh' : 'en';
			}
		} catch (e) {}
		return String(navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
	}());
	const share = page ? Number(page.share) : 0.3;
	const status = document.getElementById('status');
	const fill = document.getElementById('rg-fill');
	const words = document.getElementById('rg-words');
	const tip = document.getElementById('rg-tip');
	let shown = 0;
	let godot = false;
	let gone = false;

	function say(key, pct) {
		const w = page ? String(page.words[lang][key] || '') : '';
		return w.replace('%d%%', pct + '%').replace('%d', String(pct));
	}
	function bar(v) {
		shown = Math.max(shown, Math.min(v, 1));
		fill.style.width = 'calc(' + (shown * 320).toFixed(2) + ' * var(--u))';
		fill.style.display = shown * 320 > 12 ? 'block' : 'none';
	}

	if (page) {
		document.getElementById('rg-mark').src = page.mark;
		const logo = document.getElementById('rg-logo');
		const lines = page.logo[lang];
		const zh = lang === 'zh';
		const sizes = zh ? [74, 85] : [58, 67];
		const strokes = zh ? [10, 12] : [14, 17];
		const ys = zh ? [56, 128] : [56, 116];
		let svg = '<g transform="rotate(-2.9 280 88)">';
		for (let i = 0; i < lines.length; i++) {
			const line = String(lines[i]);
			const bang = line.slice(-1) === '!';
			const body = bang ? line.slice(0, -1) : line;
			const col = i === 0 ? page.logo.kicker : page.logo.word;
			svg += '<text x="280" y="' + ys[i] + '" text-anchor="middle" dominant-baseline="central" font-size="' + sizes[i]
				+ '" stroke-width="' + strokes[i] + '" fill="' + col + '">' + body
				+ (bang ? '<tspan fill="' + page.logo.bang + '">!</tspan>' : '') + '</text>';
		}
		logo.innerHTML = svg + '</g>';
		// the tips: a shuffled round, a new one every 6 s, a tap for the next
		const deck = page.tips.slice();
		for (let i = deck.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			const t = deck[i];
			deck[i] = deck[j];
			deck[j] = t;
		}
		let at = -1;
		let timer = 0;
		const show = function () {
			at = (at + 1) % deck.length;
			const t = deck[at];
			document.getElementById('rg-tip-face').src = page.faces[t.game];
			const title = document.getElementById('rg-tip-title');
			title.textContent = t.title[lang];
			title.style.color = t.accent;
			document.getElementById('rg-tip-text').textContent = t.text[lang];
		};
		const next = function () {
			clearTimeout(timer);
			tip.classList.add('swap');
			setTimeout(function () {
				show();
				tip.classList.remove('swap');
			}, 140);
			timer = setTimeout(next, 6000);
		};
		tip.addEventListener('pointerup', next);
		show();
		timer = setTimeout(next, 6000);
	} else {
		document.getElementById('rg-col').style.visibility = 'hidden';
	}
	words.textContent = say('loading', 0);
	bar(0);

	// The boot screen takes the bar over, then lifts this page off.
	window.rgBoot = {
		share: share,
		progress: function (v) {
			godot = true;
			bar(share + (1 - share) * Number(v));
		},
		status: function (text) {
			words.textContent = String(text);
		},
		// the boot screen's pieces, [x, y, w, h] in the 720 x 1280 units: each
		// of ours eases its middle onto its twin's, so the hand-over never jumps
		layout: function (json) {
			let r = null;
			try { r = JSON.parse(String(json)); } catch (e) { return; }
			const u = Math.min(window.innerWidth / 720, window.innerHeight / 1280);
			const ids = { mark: 'rg-mark', logo: 'rg-logo', tip: 'rg-tip', bar: 'rg-bar', words: 'rg-words' };
			for (const key in ids) {
				const el = document.getElementById(ids[key]);
				const t = r[key];
				if (!el || !t) {
					continue;
				}
				const was = el.style.translate;
				el.style.transition = 'none';
				el.style.translate = 'none';
				const b = el.getBoundingClientRect();
				const dx = (t[0] + t[2] / 2) * u - (b.left + b.width / 2);
				const dy = (t[1] + t[3] / 2) * u - (b.top + b.height / 2);
				el.style.translate = was || 'none';
				void el.offsetWidth;
				el.style.transition = '';
				el.style.translate = dx.toFixed(1) + 'px ' + dy.toFixed(1) + 'px';
			}
		},
		hide: function () {
			if (gone) {
				return;
			}
			gone = true;
			status.classList.add('gone');
			setTimeout(function () { status.remove(); }, 450);
		},
		engine: function (current, total) {
			if (!godot && total > 0) {
				bar(share * current / total);
				words.textContent = say('loading', Math.floor(current / total * 100));
			}
		},
		started: function () {
			// a build that never takes the page over still lifts it
			setTimeout(function () { if (!godot) { window.rgBoot.hide(); } }, 4000);
			setTimeout(function () { window.rgBoot.hide(); }, 20000);
		},
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		statusOverlay.style.visibility = 'visible';
		engine.startGame({
			'onProgress': function (current, total) {
				window.rgBoot.engine(current, total);
			},
		}).then(() => {
			initializing = false;
			window.rgBoot.started();
		}, displayFailureNotice);
	}
}());
		</script>
